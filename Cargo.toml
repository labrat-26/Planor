[workspace]
members=["tools/planor-rec"]

[package]
name="planor"
version="0.1.0"
edition="2024"
[lib]
path="src/core.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
windows = { version="0.62.2", features=["Win32_Graphics_Dwm","Win32_System_WinRT_Graphics_Capture","Win32_System_WinRT_Direct3D11","Graphics_Capture","Graphics_DirectX_Direct3D11","Win32_Graphics_DirectComposition","Win32_Graphics_Direct2D","Win32_Graphics_Direct2D_Common","Win32_Graphics_Direct3D11","Win32_Graphics_Direct3D","Win32_Graphics_Dxgi","Win32_Graphics_Dxgi_Common","Win32_System_Com","Win32_Graphics_Gdi","Win32_UI_WindowsAndMessaging"] }
windows-sys = { version="0.61", features=["Win32_UI_Controls","Win32_UI_Shell","Win32_Graphics_GdiPlus","Win32_UI_HiDpi","Win32_UI_WindowsAndMessaging","Win32_UI_Accessibility","Win32_UI_Input_KeyboardAndMouse","Win32_UI_Input","Win32_Devices_HumanInterfaceDevice","Win32_System_Pipes","Win32_System_IO","Win32_Security_Authorization","Win32_System_Memory","Win32_System_Threading","Win32_Storage_FileSystem","Win32_System_LibraryLoader","Win32_Graphics_Dwm","Win32_Graphics_Gdi","Win32_System_RemoteDesktop","Win32_System_Registry","Win32_System_Console","Win32_System_Performance"] }
winvd="0.0.49"
serde={version="1",features=["derive"]}
serde_json="1"
toml="1"
clap={version="4",features=["derive"]}
crossbeam-channel="0.5"
crossbeam-queue="0.3"
tracing="0.1"
windows58={package="windows",version="0.58",features=["Win32_Foundation"]}
png = "0.18"
ratatui = "0.30"
toml_edit = "0.25.20"
