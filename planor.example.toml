[layout]
tile_existing_on_startup = true
first_pair_split = true
default_tile_share = 0.5
gap_px = 6
peek_enabled = true
peek_width_px = 48
stack_peek_px = 96
# Stationary dwell time in milliseconds inside a neighbour's middle range (1/4..3/4) before
# previewing neighbour shift and showing the group-entry cue (0..=5000 ms; 0 = immediate).
drag_dwell_ms = 250
# Drag edge-scroll activation distance as a percentage of the active monitor's usable strip-axis
# span (0..=40 %; 0 = disabled). Applies to both mouse and four-finger touchpad drags.
drag_edge_scroll_percent = 10

# A new window opens on the monitor under the mouse cursor.
spawn_on_cursor_monitor = true
# Group modifier key for mouse drags ("Shift", "Ctrl", or "Alt"): after dwelling in a neighbour's
# middle range (1/4..3/4), pressing this key activates mouse group mode and starts the stack animation
# immediately. Releasing the mouse without pressing it tiles on the midpoint-selected side. Does not
# control four-finger trackpad group entry (which uses a perpendicular swipe instead).
drag_stack_modifier = "Shift"
focus_follows_mouse = false
warp_cursor_to_focused = false
# Scroll the strip to a window that takes focus while off screen (alt-tab, taskbar, a dialog closing).
# Off: focus moves to it but the strip stays where it is.
reveal_on_focus = true

[borders]
enabled = true
width_px = 2
corner_radius_px = 8
focused_color = "#3B82F6"
stacked_color = "#A855F7"
pinned_color = "#F59E0B"

[animation]
enabled = true
duration_ms = 180
curve = "ease_out_cubic"
scroll = true
open_close = true
resize = true
drag_reflow = true
stack_switch = true
# Cover newly opened or cross-monitor windows on-screen behind a dark card (with a spinner if >120 ms) while they resize.
placeholder = true

[touchpad]
three_finger_enabled = true
axis_lock_deadzone = 12
scroll_sensitivity = 1.0
# Three fingers step the focus (left/right/up/down); four fingers move the focused window left/right.
# One step per swipe_step_px of finger travel. natural_direction: content follows the fingers.
swipe_step_px = 60
swipe_natural_direction = true
# Four fingers pick the focused window up and carry it; it drops where the fingers lift.
# swipe_drag_gain: window travel per unit of finger travel.
swipe_drag_gain = 7.0
# Drag axis lock: a four-finger drag only starts along the strip axis (sideways on landscape, up and down on portrait);
# a cross-axis start does nothing. The carried window slides along that axis on its starting monitor (only a qualifying
# fling crosses monitors). Over the window's own group column it moves freely to reorder siblings; after dwelling in a
# neighbour's middle range (1/4..3/4), a perpendicular swipe activates stack entry. Off: free drag on the starting monitor.
drag_axis_lock = true
# Acceleration: extra gain per 1000 units/s of smoothed finger speed, capped at 1.6x (0 = linear). Kept small so one swipe always moves the window about the same.
swipe_drag_accel = 0.15
# Three fingers sideways scroll the strip live (focus follows the window nearest the centre) and
# settle on lift. swipe_scroll_gain: strip travel per unit of finger travel.
swipe_scroll_gain = 4.0
# Momentum: a fast swipe keeps scrolling after the fingers lift and slows down.
swipe_inertia = true
# Automatically focus the window scrolled to when a 3-finger scroll settles (off by default).
scroll_autofocus = false
# Fling: a flick faster than swipe_fling_speed (units/s) at lift-off throws the window to the
# neighbouring screen in that direction. The owner's recorded flicks ran at about 1000-1100 units/s.
swipe_fling_enabled = true
swipe_fling_speed = 900

[mouse]
# Win + MOUSE wheel (not the touchpad) scrolls the strip under the cursor along its axis (sideways on landscape, up and down on
# portrait), or rolls the focused group when a group is focused; Win + Shift + wheel does the opposite. Strip travel per wheel notch:
win_wheel_step_px = 240

[diagnostics]
enabled = false
max_log_mb = 25
max_log_files = 3

[hotkeys]
# Win+W (diagnostic note) only reacts to physical keypresses: Win+W sent by key-injecting tools
# (AutoHotkey, PowerToys remaps, the on-screen keyboard) is ignored by the hotkey path (#71).
focus_left = "Alt+Left"
focus_right = "Alt+Right"
focus_up = "Alt+Up"
focus_down = "Alt+Down"
move_left = "Alt+Shift+Left"
move_right = "Alt+Shift+Right"
stack_toggle = "Alt+S"
toggle_pin = "Alt+P"
focus_monitor_next = "Alt+]"
focus_monitor_prev = "Alt+["
panic_exit = "Ctrl+Alt+Shift+Backspace"

[[rules]]
process = "Taskmgr.exe"
action = "ignore"
