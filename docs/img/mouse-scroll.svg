<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Animation: holding the Win key and turning the mouse wheel scrolls the strip">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141a33"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="800" height="300" rx="18" fill="url(#bg)"/>
<rect x="62" y="52" width="54" height="26" rx="6" fill="#222c52" stroke="#4a5aa6" stroke-width="1.5"/><text x="89" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#dbe3ff">Win</text> <text x="128" y="70" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#aeb9e6">+</text>
<!-- the mouse -->
<rect x="150" y="90" width="96" height="150" rx="46" fill="#10162e" stroke="#3a4a8c" stroke-width="2.5"/>
<line x1="198" y1="90" x2="198" y2="150" stroke="#3a4a8c" stroke-width="2"/>
<rect x="190" y="106" width="16" height="34" rx="8" fill="#1b2340" stroke="#60a5fa" stroke-width="2"/>
<clipPath id="wheel"><rect x="190" y="106" width="16" height="34" rx="8"/></clipPath>
<g clip-path="url(#wheel)">
  <g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 22;0 22;0 0" keyTimes="0;.1;.55;.8;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
    <rect x="190" y="104" width="16" height="3" fill="#60a5fa"/><rect x="190" y="114" width="16" height="3" fill="#60a5fa"/><rect x="190" y="124" width="16" height="3" fill="#60a5fa"/><rect x="190" y="134" width="16" height="3" fill="#60a5fa"/><rect x="190" y="94" width="16" height="3" fill="#60a5fa"/><rect x="190" y="84" width="16" height="3" fill="#60a5fa"/>
  </g>
</g>
<text x="198" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#aeb9e6">hold Win, turn the wheel</text>
<polygon points="312,138 326,145 312,152" fill="#60a5fa"/>
<clipPath id="sm"><rect x="365" y="60" width="405" height="180" rx="10"/></clipPath>
<rect x="360" y="55" width="415" height="190" rx="12" fill="#0a0f24" stroke="#33407a" stroke-width="2"/>
<g clip-path="url(#sm)">
  <g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-148 0;-148 0;0 0" keyTimes="0;.1;.55;.8;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
    <g transform="translate(350 80)" filter="url(#shadow)">
  <rect width="136" height="140" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="136" height="26" rx="10" fill="#0ea5e9" opacity=".9"/><rect y="14" width="136" height="12" fill="#0ea5e9" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="124" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Terminal</text>
  <rect x="18" y="46" width="100" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="70" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="85" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="100" height="10" rx="6" fill="#222c52"/>
</g><g transform="translate(498 80)" filter="url(#shadow)">
  <rect width="136" height="140" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="136" height="26" rx="10" fill="#6366f1" opacity=".9"/><rect y="14" width="136" height="12" fill="#6366f1" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="124" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Browser</text>
  <rect x="18" y="46" width="100" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="70" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="85" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="100" height="10" rx="6" fill="#222c52"/>
</g><g transform="translate(646 80)" filter="url(#shadow)">
  <rect width="136" height="140" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="136" height="26" rx="10" fill="#14b8a6" opacity=".9"/><rect y="14" width="136" height="12" fill="#14b8a6" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="124" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Editor</text>
  <rect x="18" y="46" width="100" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="70" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="85" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="100" height="10" rx="6" fill="#222c52"/>
</g><g transform="translate(794 80)" filter="url(#shadow)">
  <rect width="136" height="140" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="136" height="26" rx="10" fill="#ec4899" opacity=".9"/><rect y="14" width="136" height="12" fill="#ec4899" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="124" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Notes</text>
  <rect x="18" y="46" width="100" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="70" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="85" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="100" height="10" rx="6" fill="#222c52"/>
</g><g transform="translate(942 80)" filter="url(#shadow)">
  <rect width="136" height="140" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="136" height="26" rx="10" fill="#f97316" opacity=".9"/><rect y="14" width="136" height="12" fill="#f97316" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="124" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Music</text>
  <rect x="18" y="46" width="100" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="70" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="85" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="100" height="10" rx="6" fill="#222c52"/>
</g>
  </g>
  <rect x="498" y="80" width="136" height="140" rx="10" fill="none" stroke="#3B82F6" stroke-width="3.5" filter="url(#glow)"/>
</g>
<text x="567" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#aeb9e6">each notch moves the strip a fixed step</text>
</svg>
