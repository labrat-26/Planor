<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Animation: a window is flicked left onto the portrait monitor and back to the landscape monitor">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141a33"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="800" height="340" rx="18" fill="url(#bg)"/>
<rect x="28" y="16" width="190" height="280" rx="12" fill="#0a0f24" stroke="#33407a" stroke-width="2"/>
<rect x="260" y="50" width="512" height="220" rx="12" fill="#0a0f24" stroke="#33407a" stroke-width="2"/>
<rect x="100" y="300" width="46" height="8" rx="4" fill="#33407a"/><rect x="490" y="274" width="72" height="8" rx="4" fill="#33407a"/>
<g transform="translate(280 85)" filter="url(#shadow)">
  <rect width="200" height="150" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="200" height="26" rx="10" fill="#0ea5e9" opacity=".9"/><rect y="14" width="200" height="12" fill="#0ea5e9" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="188" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Terminal</text>
  <rect x="18" y="46" width="164" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="114.8" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="139.4" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="164" height="20" rx="6" fill="#222c52"/>
</g>
<!-- tall version, once it has landed on the portrait monitor -->
<g opacity="0">
  <animate attributeName="opacity" values="0;1;0" keyTimes="0;.28;.5" dur="9s" repeatCount="indefinite" calcMode="discrete"/>
  <g transform="translate(58 56)" filter="url(#shadow)">
  <rect width="130" height="200" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="130" height="26" rx="10" fill="#6366f1" opacity=".9"/><rect y="14" width="130" height="12" fill="#6366f1" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="118" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Browser</text>
  <rect x="18" y="46" width="94" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="65.8" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="79.9" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="94" height="70" rx="6" fill="#222c52"/>
</g>
  <rect x="58" y="56" width="130" height="200" rx="10" fill="none" stroke="#3B82F6" stroke-width="3.5" filter="url(#glow)"/>
</g>
<!-- the flying window -->
<g>
  <animate attributeName="opacity" values="1;0;1" keyTimes="0;.28;.5" dur="9s" repeatCount="indefinite" calcMode="discrete"/>
  <animateTransform attributeName="transform" type="translate" values="540 85;540 85;58 105;58 105;540 85;540 85" keyTimes="0;.12;.28;.5;.66;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1;0 0 1 1;.3 0 .2 1;0 0 1 1"/>
  <g>
    <animateTransform attributeName="transform" type="scale" values="1;1;.68;.68;1;1" keyTimes="0;.12;.28;.5;.66;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1;0 0 1 1;.3 0 .2 1;0 0 1 1"/>
    <rect x="200" y="30" width="170" height="4" rx="2" fill="#93C5FD" opacity="0"><animate attributeName="opacity" values="0;0;.7;0;0;0;0;0;0" keyTimes="0;.14;.2;.28;.5;.54;.6;.66;1" dur="9s" repeatCount="indefinite" /></rect>
    <rect x="220" y="76" width="190" height="4" rx="2" fill="#93C5FD" opacity="0"><animate attributeName="opacity" values="0;0;.6;0;0;0;0;0;0" keyTimes="0;.14;.2;.28;.5;.54;.6;.66;1" dur="9s" repeatCount="indefinite" /></rect>
    <rect x="-180" y="30" width="170" height="4" rx="2" fill="#93C5FD" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;0;.7;0;0" keyTimes="0;.14;.2;.28;.5;.54;.6;.66;1" dur="9s" repeatCount="indefinite" /></rect>
    <rect x="-200" y="76" width="190" height="4" rx="2" fill="#93C5FD" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;0;.6;0;0" keyTimes="0;.14;.2;.28;.5;.54;.6;.66;1" dur="9s" repeatCount="indefinite" /></rect>
    <g transform="translate(0 0)" filter="url(#shadow)">
  <rect width="200" height="150" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="200" height="26" rx="10" fill="#6366f1" opacity=".9"/><rect y="14" width="200" height="12" fill="#6366f1" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="188" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Browser</text>
  <rect x="18" y="46" width="164" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="114.8" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="139.4" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="164" height="20" rx="6" fill="#222c52"/>
</g>
    <rect width="200" height="150" rx="10" fill="none" stroke="#3B82F6" stroke-width="3.5" filter="url(#glow)"/>
  </g>
</g>
<text x="123" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#aeb9e6" >Portrait</text>
<text x="526" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#aeb9e6" >Landscape</text>
<text x="526" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#dbe3ff">A quick flick throws the window to the monitor in that direction, whatever its shape.</text>
</svg>
