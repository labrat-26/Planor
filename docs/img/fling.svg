<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Animation: flicking a window throws it to the neighbouring monitor">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141a33"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="800" height="300" rx="18" fill="url(#bg)"/>
<rect x="30" y="40" width="340" height="200" rx="10" fill="#0a0f24" stroke="#33407a" stroke-width="2"/>
<rect x="430" y="40" width="340" height="200" rx="10" fill="#0a0f24" stroke="#33407a" stroke-width="2"/>
<rect x="170" y="246" width="60" height="8" rx="4" fill="#33407a"/><rect x="570" y="246" width="60" height="8" rx="4" fill="#33407a"/>
<text x="200" y="275" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#7f8bbf">Monitor 1</text>
<text x="600" y="275" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#7f8bbf">Monitor 2</text>
<g>
  <animateTransform attributeName="transform" type="translate" values="105 70;105 70;130 70;560 70;560 70;105 70" keyTimes="0;.2;.3;.5;.9;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.5 0 .9 .6;.1 .7 .3 1;0 0 1 1;0 0 1 1"/>
  <rect x="-18" y="30" width="190" height="4" rx="2" fill="#93C5FD" opacity="0">
    <animate attributeName="opacity" values="0;0;.7;0;0" keyTimes="0;.28;.36;.5;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="-40" y="76" width="220" height="4" rx="2" fill="#93C5FD" opacity="0">
    <animate attributeName="opacity" values="0;0;.6;0;0" keyTimes="0;.28;.36;.5;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(0 0)" filter="url(#shadow)">
  <rect width="190" height="150" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="190" height="26" rx="10" fill="#6366f1" opacity=".9"/><rect y="14" width="190" height="12" fill="#6366f1" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="178" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Browser</text>
  <rect x="18" y="46" width="154" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="107.8" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="130.9" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="154" height="20" rx="6" fill="#222c52"/>
</g>
  <rect width="190" height="150" rx="10" fill="none" stroke="#3B82F6" stroke-width="3.5" filter="url(#glow)"/>
</g>
<text x="400" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#aeb9e6">A quick flick on the touchpad throws the window to the monitor in that direction.</text>
</svg>
