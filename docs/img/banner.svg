<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150" role="img" aria-label="Planor">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141a33"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="800" height="150" rx="18" fill="url(#bg)"/>
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;-120 0" dur="12s" repeatCount="indefinite"/>
  <g opacity=".35">
    <rect x="20" y="104" width="90" height="26" rx="6" fill="#0ea5e9"/><rect x="122" y="104" width="90" height="26" rx="6" fill="#6366f1"/>
    <rect x="224" y="104" width="90" height="26" rx="6" fill="#14b8a6"/><rect x="326" y="104" width="90" height="26" rx="6" fill="#ec4899"/>
    <rect x="428" y="104" width="90" height="26" rx="6" fill="#f97316"/><rect x="530" y="104" width="90" height="26" rx="6" fill="#8b5cf6"/>
    <rect x="632" y="104" width="90" height="26" rx="6" fill="#0ea5e9"/><rect x="734" y="104" width="90" height="26" rx="6" fill="#6366f1"/>
    <rect x="836" y="104" width="90" height="26" rx="6" fill="#14b8a6"/>
  </g>
</g>
<text x="400" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#fff" letter-spacing="2">Planor</text>
<text x="400" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#aeb9e6">A scrolling tiling window manager for Windows 11</text>
</svg>
