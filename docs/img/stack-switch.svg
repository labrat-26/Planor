<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Animation: a stack shows its windows in a vertical list; pressing Alt+Down moves the selection to the next one">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141a33"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="800" height="340" rx="18" fill="url(#bg)"/>
<rect x="28" y="30" width="744" height="232" rx="12" fill="#0a0f24" stroke="#33407a" stroke-width="2"/>
<g opacity=".6"><g transform="translate(44 52)" filter="url(#shadow)">
  <rect width="200" height="190" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="200" height="26" rx="10" fill="#0ea5e9" opacity=".9"/><rect y="14" width="200" height="12" fill="#0ea5e9" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="188" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Terminal</text>
  <rect x="18" y="46" width="164" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="114.8" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="139.4" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="164" height="60" rx="6" fill="#222c52"/>
</g></g>
<!-- the stack slot -->
<rect x="268" y="52" width="488" height="192" rx="10" fill="#141a33" stroke="#A855F7" stroke-width="3.5" filter="url(#glow)"/>
<rect x="290" y="78" width="104" height="46" rx="8" fill="#1b2340" stroke="#2c3868"/><text x="342" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#aeb9e6">Browser</text><rect x="290" y="136" width="104" height="46" rx="8" fill="#1b2340" stroke="#2c3868"/><text x="342" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#aeb9e6">Notes</text><rect x="290" y="194" width="104" height="46" rx="8" fill="#1b2340" stroke="#2c3868"/><text x="342" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#aeb9e6">Mail</text>
<!-- vertical selection marker -->
<rect x="286" y="74" width="112" height="54" rx="10" fill="none" stroke="#A855F7" stroke-width="3">
  <animate attributeName="y" values="74;74;132;132;190;190;74" keyTimes="0;.27;.32;.57;.62;.92;1" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1" dur="9s" repeatCount="indefinite"/>
</rect>
<text x="342" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#c4a3f5">in this stack</text>
<g opacity="0"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.28;.32;.62;.92;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/><g transform="translate(410 66)" filter="url(#shadow)">
  <rect width="330" height="178" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="330" height="26" rx="10" fill="#6366f1" opacity=".9"/><rect y="14" width="330" height="12" fill="#6366f1" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="318" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Browser</text>
  <rect x="18" y="46" width="294" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="205.8" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="249.9" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="294" height="48" rx="6" fill="#222c52"/>
</g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;.28;.32;.62;.92;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/><g transform="translate(410 66)" filter="url(#shadow)">
  <rect width="330" height="178" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="330" height="26" rx="10" fill="#ec4899" opacity=".9"/><rect y="14" width="330" height="12" fill="#ec4899" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="318" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Notes</text>
  <rect x="18" y="46" width="294" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="205.8" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="249.9" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="294" height="48" rx="6" fill="#222c52"/>
</g></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;.28;.32;.62;.92;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/><g transform="translate(410 66)" filter="url(#shadow)">
  <rect width="330" height="178" rx="10" fill="#1b2340" stroke="#2c3868" stroke-width="1.5"/>
  <rect width="330" height="26" rx="10" fill="#8b5cf6" opacity=".9"/><rect y="14" width="330" height="12" fill="#8b5cf6" opacity=".9"/>
  <circle cx="14" cy="13" r="3.5" fill="#fff" opacity=".85"/><circle cx="26" cy="13" r="3.5" fill="#fff" opacity=".55"/>
  <text x="318" y="17" text-anchor="end" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Mail</text>
  <rect x="18" y="46" width="294" height="8" rx="4" fill="#3a4676"/>
  <rect x="18" y="64" width="205.8" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="82" width="249.9" height="8" rx="4" fill="#2f3963"/>
  <rect x="18" y="108" width="294" height="48" rx="6" fill="#222c52"/>
</g></g>
<g>
  <animate attributeName="opacity" values="0;1;0;0;1;0;0;1;0;0" keyTimes="0;.28;.36;.55;.6;.68;.88;.93;.99;1" dur="9s" repeatCount="indefinite"/>
  <rect x="336" y="284" width="128" height="26" rx="6" fill="#222c52" stroke="#4a5aa6" stroke-width="1.5"/><text x="400" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#dbe3ff">Alt + Down</text>
</g>
<text x="400" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#aeb9e6">A stack lists its windows top to bottom. Step through them with Alt+Up and Alt+Down.</text>
</svg>
